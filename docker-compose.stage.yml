services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: db-itmentorsoft
    env_file: .env.stage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_mentorsoft -d mentorsoft"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    container_name: valkey
    ports:
      - "6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluator:
    image: ghcr.io/devgalop/itmentorsoft-back-worker-evaluator:latest
    container_name: evaluator-itmentorsoft
    env_file: .env.stage
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  notificator:
    image: ghcr.io/devgalop/itmentorsoft-back-worker-notificator:latest
    container_name: notificator-itmentorsoft
    env_file: .env.stage
    ports:
      - "8002:8000"
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy

  api:
    image: ghcr.io/devgalop/itmentorsoft-back-api:latest
    container_name: api-itmentorsoft
    env_file: .env.stage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data: