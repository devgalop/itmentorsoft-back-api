services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: db-itmentorsoft
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_mentorsoft -d mentorsoft"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/data
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    container_name: valkey
    ports:
      - "6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluator:
    image: ghcr.io/devgalop/itmentorsoft-back-worker-evaluator:latest
    container_name: evaluator-itmentorsoft
    env_file: .env
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      floci:
        condition: service_started

  notificator:
    image: ghcr.io/devgalop/itmentorsoft-back-worker-notificator:latest
    container_name: notificator-itmentorsoft
    env_file: .env
    ports:
      - "8002:8000"
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      floci:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-itmentorsoft
    env_file: .env
    environment:
      # Override URL bases for local container networking
      - RECOVERY_URL_BASE=http://localhost:8000/reset-password
      - REVIEW_URL_BASE=http://localhost:8000/assessments/pending-approval-questions
      - LOGIN_URL_BASE=http://localhost:8000/login
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      floci:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  floci_data:
