name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/devgalop/itmentorsoft-persistence.git@master

      - name: Run tests
        run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET_KEY: test-secret-key
          JWT_ALGORITHM: HS256
          JWT_EXPIRATION_DELTA_SECONDS: "1800"
          RANDOM_TOKEN_EXPIRATION_DELTA_SECONDS: "1800"
          REFRESH_TOKEN_EXPIRATION_DELTA_SECONDS: "604800"
          DB_POOL_SIZE: "5"
          DB_MAX_OVERFLOW: "10"
          DB_POOL_TIMEOUT: "30"
          DB_POOL_RECYCLE: "3600"
          ASSESSMENT_MAX_QUESTIONS_NUMBER: "5"
